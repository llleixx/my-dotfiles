##### Prefix #####

# Use Alt-f as the tmux prefix
unbind C-b
set -g prefix M-f
bind M-f send-prefix

##### Indexing #####

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after one is closed
set -g renumber-windows on

##### General #####

set -s set-clipboard external

# Keep a large scrollback history
set -g history-limit 100000

# Enable mouse support
set -g mouse on

# Reduce escape delay for a snappier Vim experience
set -sg escape-time 10

# Use a modern default terminal entry
set -g default-terminal "tmux-256color"

# Enable true color for common xterm-compatible terminals
set -sa terminal-features ",xterm*:RGB"

# Prevent programs from renaming windows automatically
set -g allow-rename off

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### Vim-style behavior #####

# Use vi keys in copy mode
setw -g mode-keys vi

# Use vi keys in command/status prompts
set -g status-keys vi

##### Copy mode #####

# Make copy mode feel closer to Vim visual mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Vim-like searching inside copy mode
bind-key -T copy-mode-vi / send -X search-forward
bind-key -T copy-mode-vi ? send -X search-backward
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse

##### Pane navigation #####

# Move between panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with repeatable HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Splits and windows #####

# Split panes and keep the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create a new window in the current working directory
bind c new-window -c "#{pane_current_path}"

# Confirm before killing a pane
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Toggle zoom for the current pane
bind z resize-pane -Z

# Rename the current window
bind , command-prompt -I "#W" "rename-window '%%'"

# Jump to the previously active window
bind Tab last-window

##### Session / tree chooser #####

# Open a full session/window/pane chooser
# bind s choose-tree

##### Status bar #####

set -g status-interval 5
set -g status-justify left

set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[bold]#S #[dim]| #[default]#I:#W"
set -g status-right "#[dim]#{pane_current_path} #[default]| %Y-%m-%d %H:%M"

##### Borders #####

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

##### Activity #####

# Monitor activity in windows
setw -g monitor-activity on
set -g visual-activity off

##### Optional clipboard integration #####

# Uncomment this if your terminal/OS clipboard integration works well
# set -s set-clipboard external
